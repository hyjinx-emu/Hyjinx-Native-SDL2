name: Build SDL2 native libraries
description: Build and upload SDL2 native libraries for a target platform.

inputs:
  platform:
    description: Target platform (win-x64, linux-x64, osx-x64, or osx-arm64).
    required: true
  sdl-version:
    description: SDL release version to build.
    required: false
    default: 2.30.2
  architecture:
    description: macOS architecture (x86_64 or arm64); required for macOS targets.
    required: false

runs:
  using: composite
  steps:
    - name: Checkout SDL2
      uses: actions/checkout@v6
      with:
        repository: libsdl-org/SDL
        ref: release-${{ inputs.sdl-version }}

    - name: Install dependencies (Linux)
      if: inputs.platform == 'linux-x64'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y cmake build-essential \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
          libxi-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
          libudev-dev libdbus-1-dev libwayland-dev libxkbcommon-dev \
          wayland-protocols

    - name: Install dependencies (macOS)
      if: startsWith(inputs.platform, 'osx-')
      shell: bash
      run: brew install cmake

    - name: Create build folder
      shell: bash
      run: mkdir build

    - name: Configure SDL2 (Windows)
      if: inputs.platform == 'win-x64'
      shell: bash
      working-directory: build
      run: |
        cmake .. \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
          -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/out

    - name: Configure SDL2 (Linux)
      if: inputs.platform == 'linux-x64'
      shell: bash
      working-directory: build
      run: |
        cmake .. \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/out

    - name: Configure SDL2 (macOS)
      if: startsWith(inputs.platform, 'osx-')
      shell: bash
      working-directory: build
      run: |
        cmake .. \
          -DCMAKE_OSX_ARCHITECTURES=${{ inputs.architecture }} \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/out

    - name: Build SDL2 (Windows)
      if: inputs.platform == 'win-x64'
      shell: bash
      working-directory: build
      run: cmake --build . --parallel --config Release

    - name: Build SDL2 (Linux / macOS)
      if: inputs.platform != 'win-x64'
      shell: bash
      working-directory: build
      run: cmake --build . --parallel

    - name: Install SDL2 (Windows)
      if: inputs.platform == 'win-x64'
      shell: bash
      working-directory: build
      run: cmake --install . --config Release

    - name: Install SDL2 (Linux / macOS)
      if: inputs.platform != 'win-x64'
      shell: bash
      working-directory: build
      run: cmake --install .

    - name: Prepare staging directory
      shell: bash
      run: mkdir -p dist/runtimes/${{ inputs.platform }}/native

    - name: Transfer SDL2 outputs (Windows)
      if: inputs.platform == 'win-x64'
      shell: bash
      run: cp out/bin/SDL2.dll dist/runtimes/${{ inputs.platform }}/native/

    - name: Transfer SDL2 outputs (Linux)
      if: inputs.platform == 'linux-x64'
      shell: bash
      run: cp out/lib/libSDL2.so dist/runtimes/${{ inputs.platform }}/native/

    - name: Transfer SDL2 outputs (macOS)
      if: startsWith(inputs.platform, 'osx-')
      shell: bash
      run: cp out/lib/libSDL2.dylib dist/runtimes/${{ inputs.platform }}/native/

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: native-${{ inputs.platform }}
        path: dist/
